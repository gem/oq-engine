[general]
description = ASCE 7-16 RTGM with a source model LT with extendModel branches
calculation_mode = classical
random_seed = 23

[geometry]
sites = 67.2 44.8
siteid = ASCE
site_model_file = sites_cea_res6.csv

# the site class matters, since the MCE is min(ProbMCE, max(det, DLL)) and
# the sigmas used by the deterministic MCE come from the disaggregation by
# relevant sources. With a stiff site (vs30 = 760, site class BC) the DLLs
# are 0.50, 1.50, 0.60 for PGA, SA(0.2) and SA(1.0), while the
# disaggregated det is about 1/3 of the ProbMCE, i.e. always below the
# DLLs: the MCE would be DLL-governed at all the IMTs and the sigmas would
# not influence the result at all. With vs30 = 180 (site class DE) the
# DLLs are lower (0.46, 1.15, 1.51) and the MCE for SA(0.2) is governed by
# the deterministic scenario, so that the GSIM weighting of the sigmas
# matters; it also exercises the notification for sites with vs30 < 200.
override_vs30 = 180.

[logic_tree]
number_of_logic_tree_samples = 0

[erf]
rupture_mesh_spacing = 20.0
width_of_mfd_bin = 0.5
area_source_discretization = 20.0
complex_fault_mesh_spacing = 50.0

[calculation]
source_model_logic_tree_file = ssmLT.xml
gsim_logic_tree_file = gmmLT.xml
investigation_time = 50.0
asce_version = ASCE7-16
intensity_measure_types_and_levels = {
 "PGA": logscale(0.005, 3.00, 25),
 "SA(0.2)": logscale(0.005, 9.00, 25),
 "SA(1.0)": logscale(0.005, 3.00, 25)}
truncation_level = 3.0
disagg_by_src = true
maximum_distance = {'default': 300}
horiz_comp_to_geom_mean = true
use_rates = true

[disaggregation]
distance_bin_width = 20
num_epsilon_bins = 10
mag_bin_width = 0.1
epsilon_star = true
postproc_func = compute_rtgm.main

[output]
hazard_maps = true
uniform_hazard_spectra = true
poes = 0.02 0.05 0.10 0.20 0.50
