[general]

description = Nankai mutex model with two atomic groups in the same task
calculation_mode = disaggregation
random_seed = 1066
# NB: concurrent_tasks = 1 puts both atomic groups in the same task, so
# the disaggregation needs the ruptures of both, while only the ones of
# the first group used to be stored
concurrent_tasks = 1

[geometry]

sites = 135.68 35.68

[logic_tree]

number_of_logic_tree_samples = 0

[erf]

rupture_mesh_spacing = 1.
width_of_mfd_bin = 1.
area_source_discretization =

[site_params]

reference_vs30_type = measured
reference_vs30_value = 400.0
reference_depth_to_2pt5km_per_sec = 1.
reference_depth_to_1pt0km_per_sec = 100.

[calculation]

source_model_logic_tree_file = ../../classical/case_27/source_model_logic_tree_other.xml
gsim_logic_tree_file = ../../classical/case_27/gsim_logic_tree.xml
investigation_time = 50.
intensity_measure_types_and_levels = {"PGV": [20]}
maximum_distance = 200.
truncation_level = 3

[disaggregation]

poes_disagg = 0.02
mag_bin_width = 0.1
distance_bin_width = 10.0
coordinate_bin_width = 1.0
num_epsilon_bins = 6
disagg_outputs = Mag Dist
