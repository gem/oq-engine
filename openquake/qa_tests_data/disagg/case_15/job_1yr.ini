# This run checks that mean_rates_by_src stays annual; the full
# disaggregation and ASCE postprocessing are done in job_50yr.ini.
[general]

description = investigation time 1 year (testing ASCE 7-16)
calculation_mode = classical
random_seed = 23
mosaic_model = CEA
ps_grid_spacing = 0
pointsource_distance = 100

[geometry]

sites = 67.2 44.8
siteid = ASCE
site_model_file = sites_cea_res6.csv
override_vs30 = 760.

[logic_tree]

number_of_logic_tree_samples = 0

[erf]

rupture_mesh_spacing = 20.0
width_of_mfd_bin = 0.5
area_source_discretization = 20.0
complex_fault_mesh_spacing = 50.0

[calculation]

source_model_logic_tree_file = ssmLT.xml
gsim_logic_tree_file = gmmLT.xml
investigation_time = 1.0
intensity_measure_types_and_levels = {"PGA": logscale(0.005, 3.00, 25)}

truncation_level = 3.0
disagg_by_src = true
maximum_distance = {'default': 300}
horiz_comp_to_geom_mean = true
use_rates = true
