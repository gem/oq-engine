[general]

description = Source with a zero integration distance for its first magnitude
calculation_mode = classical
random_seed = 23

[geometry]

sites = 0 0

[logic_tree]

number_of_logic_tree_samples = 0

[erf]

rupture_mesh_spacing = 2.0
width_of_mfd_bin = 0.2

[site_params]

reference_vs30_type = measured
reference_vs30_value = 600.0
reference_depth_to_2pt5km_per_sec = 5.0
reference_depth_to_1pt0km_per_sec = 100.0

[calculation]

source_model_logic_tree_file = lt.xml
investigation_time = 50.0
intensity_measure_types_and_levels = {"PGA": logscale(0.005, 1.5, 3)}
truncation_level = 3
# NB: the integration distance is 0 for M5.1, i.e. the first magnitude of
# the source is inside the integration distance and has zero distance, see
# _quintets; the magnitudes above M5.5 are outside instead
maximum_distance = [(5.1, 0.0), (5.5, 100.0)]
gsim = BooreAtkinson2008
