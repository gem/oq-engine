[general]
description = Padding source in a different tectonic region type
calculation_mode = classical
random_seed = 23

[geometry]
sites = 123.7000 10.6000

[logic_tree]
number_of_logic_tree_samples = 0

[erf]
rupture_mesh_spacing = 5.0

[site_params]
reference_vs30_type = measured
reference_vs30_value = 800.0
reference_depth_to_1pt0km_per_sec = 30.0
reference_depth_to_2pt5km_per_sec = 2.5

[calculation]
source_model_logic_tree_file = ssmLT_sea.xml
gsim_logic_tree_file = gmmLT.xml
investigation_time = 50.0
intensity_measure_types_and_levels = {"PGA": logscale(0.001, 0.1, 20)}
truncation_level = 3.0
maximum_distance = 300.0
ps_grid_spacing = 50.0

[output]
mean_hazard_curves = true
