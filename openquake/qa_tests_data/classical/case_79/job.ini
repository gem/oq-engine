[general]

description = Classical PSHA with ModifiableGMPE and apply_swiss_site_specific_amplification_sa
calculation_mode = classical
random_seed = 23

[geometry]

site_model_file = site_model.csv

[logic_tree]

number_of_logic_tree_samples = 0

[erf]

rupture_mesh_spacing = 2.0
width_of_mfd_bin = 0.2
area_source_discretization = 10.0

[calculation]

source_model_logic_tree_file = source_model_logic_tree.xml
gsim_logic_tree_file = gmpe_logic_tree.xml
investigation_time = 50.0
intensity_measure_types_and_levels = {
  "PGA": logscale(0.005, 2.13, 10),
  "SA(0.2)": logscale(0.005, 2.13, 10),
  "SA(0.4)": logscale(0.005, 2.13, 10),
  "SA(0.6)": logscale(0.005, 2.13, 10)}
truncation_level = 3
maximum_distance = 200.0

[output]

export_dir = out
