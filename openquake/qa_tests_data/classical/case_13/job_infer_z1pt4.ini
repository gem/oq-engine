[general]

description = Test Vs30-based inference of z1pt4 for -999 sentinel sites
calculation_mode = classical
random_seed = 1

[geometry]
# site_model_file so the per-site z1pt4 (including -999) is used as-is
site_model_file = site_model_infer_z1pt4.csv

[logic_tree]

number_of_logic_tree_samples = 0

[erf]

rupture_mesh_spacing = 1.0
width_of_mfd_bin = 0.2
area_source_discretization = 10

[calculation]

source_model_logic_tree_file = sscLT.xml
gsim_logic_tree_file = gmcLT.xml
investigation_time = 1.0
intensity_measure_types_and_levels = {"SA(0.5)": logscale(0.001, 1.0, 10)}
truncation_level = 3
maximum_distance = 200.0
