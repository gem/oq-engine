[general]
description =  Scenario interdependencies
calculation_mode = scenario_damage
random_seed = 113
ses_seed = 1025

[site_params]
site_model_file = site_model.csv

[exposure]
exposure_file = exposure_bdg.xml

[rupture]
rupture_model_file = rupture_model.xml
rupture_mesh_spacing = 2.0

[calculation]
intensity_measure_types = PGA, SA(1.0)
truncation_level = 3
maximum_distance = 500
number_of_ground_motion_fields = 2
gsim = AkkarBommer2010

[fragility]
structural_fragility_file = fragility_model_structural.xml

[consequence]
consequence_file = {'taxonomy': 'nonfunctional.csv'}

[risk_calculation]
discrete_damage_distribution = true
aggregate_by = id

postrisk_func = interdependencies.main
postrisk_args = {
  'child_exposure_xml':  'exposure_rdn.xml',
  'interdependencies_csv': 'interdependencies.csv'}
