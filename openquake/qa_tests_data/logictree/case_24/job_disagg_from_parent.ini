[general]
description = Site LT sampling - disagg reads dstore from classical hazard with sampling
calculation_mode = disaggregation
random_seed = 24

[geometry]
site_model_file = site_model_lt.xml

[logic_tree]
number_of_logic_tree_samples = 4

[erf]
rupture_mesh_spacing = 2.0
width_of_mfd_bin = 0.2
area_source_discretization = 20.0

[site_params]
reference_vs30_type = measured
reference_vs30_value = 760.0
reference_depth_to_2pt5km_per_sec = 5.0
reference_depth_to_1pt0km_per_sec = 100.0

[calculation]
source_model_logic_tree_file = source_model_logic_tree.xml
gsim_logic_tree_file = gsim_logic_tree.xml
investigation_time = 50.0
intensity_measure_types_and_levels = {"PGA": [0.05, 0.1, 0.2, 0.4, 0.8]}
truncation_level = 3
maximum_distance = 200.0

[disaggregation]
poes_disagg = 0.1
mag_bin_width = 0.5
distance_bin_width = 25.0
coordinate_bin_width = 1.0
num_epsilon_bins = 3
