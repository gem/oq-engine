[general]

description = Disaggregation + sampling with 3-branch amp LT
calculation_mode = disaggregation
random_seed = 20

[logic_tree]

number_of_logic_tree_samples = 4

[erf]

rupture_mesh_spacing = 5
complex_fault_mesh_spacing = 5
width_of_mfd_bin = 0.1

[site_params]

site_model_file = site_model.csv

[calculation]

source_model_logic_tree_file = source_model_logic_tree.xml
gsim_logic_tree_file = gmpe_logic_tree.xml
investigation_time = 50.0
soil_intensities = 0.01 0.02 0.05 0.1 0.15 0.2 0.3 0.5 0.7 1.0 1.5
truncation_level = 3
maximum_distance = 200.0
amplification_csv = amplification_lt.xml
amplification_method = convolution
vs30_tolerance = 80

[disaggregation]
iml_disagg = {"PGA": 0.05}
mag_bin_width = 0.5
distance_bin_width = 50
coordinate_bin_width = 1.0
num_epsilon_bins = 3

[output]

export_dir = /tmp
individual_rlzs = true
mean = true
