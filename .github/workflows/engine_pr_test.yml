# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: engine tests

on:
  pull_request:

jobs:
  # Detects whether install.py changed, to gate the heavy server-installation
  # tests below.  A gate job (instead of on.pull_request.paths) is used so the
  # required check is always reported, even when the tests are skipped.
  changes:
    runs-on: ubuntu-latest
    outputs:
      install: ${{ steps.diff.outputs.install }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Detect changes to install.py
        id: diff
        run: |
          if git diff --name-only \
               "${{ github.event.pull_request.base.sha }}" HEAD \
               | grep -qx install.py; then
            echo "install=true" >> "$GITHUB_OUTPUT"
          else
            echo "install=false" >> "$GITHUB_OUTPUT"
          fi

  server_install:
    # End-to-end server installation tests (reused from server_install.yaml);
    # run them only when install.py changed.  Fork PRs are skipped because the
    # head branch is not available in this repository.
    needs: changes
    if: >-
      needs.changes.outputs.install == 'true' &&
      !github.event.pull_request.head.repo.fork
    uses: ./.github/workflows/server_install.yaml
    with:
      git-ref: ${{ github.head_ref }}

  calculators:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        python-version: ["3.13"]
    env:
      GITHUB_HEAD_REF: ${{ github.head_ref }}
      FROM_FORK: ${{ github.event.pull_request.head.repo.fork }}
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python  ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ $FROM_FORK == "true" ]]; then
            python install.py devel --from_fork
          else
            python install.py devel
          fi
      - name: Calculators tests
        run: |
          set -e
          source ~/openquake/bin/activate
          pip install -r requirements-aelo-py-linux64.txt
          oq engine --upgrade-db
          pytest --doctest-modules -x --disable-warnings --color=yes --durations=10 openquake/calculators -k "not classical"

  hazardlib:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      matrix:
        os: [ubuntu-24.04]
        python-version: ["3.12"]
    env:
      GITHUB_HEAD_REF: ${{ github.head_ref }}
      FROM_FORK: ${{ github.event.pull_request.head.repo.fork }}
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python  ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ $FROM_FORK == "true" ]]; then
            python install.py devel --from_fork
          else
            python install.py devel
          fi
      - name: Hazardlib tests
        run: |
          set -e
          source ~/openquake/bin/activate
          pip install pyshp pytest flake8 ruff
          pip install -r requirements-aelo-py-linux64.txt
          oq engine --upgrade-db
          ruff check openquake
          curl https://downloads.openquake.org/test_data/exposure.hdf5 -o openquake/qa_tests_data/mosaic/exposure.hdf5
          pytest -xs --doctest-modules --disable-warnings --color=yes --durations=8 openquake/{sep,hmtk,risklib,commonlib,baselib,hazardlib,pfd}
          pytest -xs --doctest-modules --disable-warnings --color=yes --durations=8 openquake/calculators -k classical
          pytest --doctest-modules doc/contributing/*.rst
        shell: bash

  server:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      matrix:
        os: [ubuntu-24.04]
        python-version: ["3.11"]
    env:
      GITHUB_HEAD_REF: ${{ github.head_ref }}
      FROM_FORK: ${{ github.event.pull_request.head.repo.fork }}
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python  ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ $FROM_FORK == "true" ]]; then
            python install.py devel --from_fork
          else
            python install.py devel
          fi
      - name: Server tests
        run: |
          set -x
          source ~/openquake/bin/activate
          oq engine --upgrade-db
          pip install https://wheelhouse.openquake.org/unified/pytest_django-4.9.0-py3-none-any.whl
          pip install -r requirements-aelo-py-linux64.txt
          pip install -r requirements-impact-py311-linux64.txt
          OQ_APPLICATION_MODE=PUBLIC pytest -vx openquake/server/tests/test_public_mode.py
          OQ_APPLICATION_MODE=RESTRICTED pytest -vx openquake/server/tests/test_restricted_mode.py
          OQ_APPLICATION_MODE=READ_ONLY pytest -vx openquake/server/tests/test_read_only_mode.py
          OQ_APPLICATION_MODE=IMPACT pytest -vx openquake/server/tests/test_impact_mode.py
          OQ_APPLICATION_MODE=AELO pytest -vx openquake/server/tests/test_aelo_mode.py
          pytest -xs --doctest-modules --disable-warnings --color=yes --durations=8 openquake/{commands,engine}  # _unc moved to nightly tests

  server_UI:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      matrix:
        os: [ubuntu-24.04]
        python-version: ["3.11"]
        browser: ['chromium', 'firefox']
    env:
      GITHUB_HEAD_REF: ${{ github.head_ref }}
      FROM_FORK: ${{ github.event.pull_request.head.repo.fork }}
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python  ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ $FROM_FORK == "true" ]]; then
            python install.py devel --from_fork
          else
            python install.py devel
          fi
      - name: Server tests
        run: |
          set -x
          source ~/openquake/bin/activate
          PY_VER=$(echo "${{ matrix.python-version }}" | tr -d '.')
          pip install -r requirements-impact-py${PY_VER}-linux64.txt
          oq engine --upgrade-db
          pip install https://wheelhouse.openquake.org/unified/pytest_django-4.9.0-py3-none-any.whl
          pip install https://wheelhouse.openquake.org/unified/playwright-1.57.0-py3-none-manylinux1_x86_64.whl
          pip install https://wheelhouse.openquake.org/unified/text_unidecode-1.3-py2.py3-none-any.whl
          pip install https://wheelhouse.openquake.org/unified/python_slugify-8.0.4-py2.py3-none-any.whl
          pip install https://wheelhouse.openquake.org/unified/pytest_base_url-2.1.0-py3-none-any.whl
          pip install https://wheelhouse.openquake.org/unified/pytest_playwright-0.7.2-py3-none-any.whl
          playwright install chromium firefox
          OQ_APPLICATION_MODE=AELO pytest \
            --browser ${{ matrix.browser }} \
            --capture=no \
            --maxfail=1 \
            --tb=short \
            openquake/server/tests/test_aelo_mode_ui.py \
            --tracing retain-on-failure \
            --screenshot only-on-failure \
            --video retain-on-failure
          OQ_APPLICATION_MODE=RESTRICTED pytest \
            --browser ${{ matrix.browser }} \
            --capture=no \
            --maxfail=1 \
            --tb=short \
            openquake/server/tests/test_restricted_mode_ui.py \
            --tracing retain-on-failure \
            --screenshot only-on-failure \
            --video retain-on-failure
          OQ_APPLICATION_MODE=IMPACT pytest \
            --browser ${{ matrix.browser }} \
            --capture=no \
            --maxfail=1 \
            --tb=short \
            openquake/server/tests/test_impact_mode_ui.py \
            --tracing retain-on-failure \
            --screenshot only-on-failure \
            --video retain-on-failure
      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts-python${{ matrix.python-version }}-${{ matrix.os }}-${{ matrix.browser }}
          path: test-results
          retention-days: 7

  irmt_qgis:
    name: IRMT QGIS integration tests
    # Replace 'integrate' -> 'master' after merging
    uses: gem/oq-irmt-qgis/.github/workflows/test_push.yml@integrate
    with:
      engine_repository: ${{ github.event.pull_request.head.repo.full_name }}
      engine_ref: ${{ github.event.pull_request.head.sha }}
      irmt_ref: master
      integration_only: true
    permissions:
      contents: read
