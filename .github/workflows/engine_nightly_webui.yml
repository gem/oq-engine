name: WebUI frontend UI tests
on:
  workflow_dispatch:
    inputs:
      git-ref:
        description: Git Ref
        default: master
        required: true
  schedule:
    - cron: "30 23 * * *"

jobs:
  server_impact_mode:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        python-version: ["3.11", "3.12", "3.13"]
        browser: ['chromium', 'firefox']
    env:
      GITHUB_HEAD_REF: ${{ github.head_ref }}
    steps:
      # This Checkout use git-ref keyword from dispatch
      - name: Clone Repository (Master)
        uses: actions/checkout@v6
        if: github.event.inputs.git-ref == ''
      - name: Clone Repository (Custom Ref)
        uses: actions/checkout@v6
        if: github.event.inputs.git-ref != ''
        with:
          ref: ${{ github.event.inputs.git-ref }}
      - name: Set up Python  ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run Installation of oq-engine in devel mode
        env:
          BRANCH: ${{ github.event.inputs.git-ref }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          export PIP_DEFAULT_TIMEOUT=100
          pip3 install -U pip wheel setuptools
          #
          echo "branch to test: ${BRANCH}"
          python install.py devel
      - name: Server 'IMPACT' mode tests
        env:
          OQ_APPLICATION_MODE: IMPACT
        run: |
          set -x
          date
          wget https://downloads.openquake.org/test_data/exposure.hdf5
          date
          mv exposure.hdf5 openquake/qa_tests_data/mosaic/
          source ~/openquake/bin/activate
          oq engine --upgrade-db
          touch ~/webui-access.log
          pip install https://wheelhouse.openquake.org/v3/py/pytest_django-4.9.0-py3-none-any.whl
          pip install https://wheelhouse.openquake.org/unified/playwright-1.57.0-py3-none-manylinux1_x86_64.whl
          pip install https://wheelhouse.openquake.org/unified/text_unidecode-1.3-py2.py3-none-any.whl
          pip install https://wheelhouse.openquake.org/unified/python_slugify-8.0.4-py2.py3-none-any.whl
          pip install https://wheelhouse.openquake.org/unified/pytest_base_url-2.1.0-py3-none-any.whl
          pip install https://wheelhouse.openquake.org/unified/pytest_playwright-0.7.2-py3-none-any.whl
          playwright install ${{ matrix.browser }}
          pytest -v \
            --browser ${{ matrix.browser }} \
            --capture=no \
            --maxfail=1 \
            --tb=short \
            openquake/server/tests/test_impact_mode_ui.py \
            --tracing retain-on-failure \
            --screenshot only-on-failure \
            --video retain-on-failure
      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts-impact-python${{ matrix.python-version }}-${{ matrix.os }}-${{ matrix.browser }}
          path: test-results
          retention-days: 7
