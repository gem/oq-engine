name: Build Image Production for Docker
on:
  workflow_dispatch:
    inputs:
      tags:
        description: "Comma-separated list of tags (e.g. v3.23,latest)"
        default: "nightly"
        required: true
      git-ref:
        description: "Git Ref"
        default: "master"
        required: true
  push:
    branches:
      - docker-action
    paths:
      - 'docker/**'
      - '.github/workflows/**'
  schedule:
    - cron: "45 23 * * *"

env:
  IMAGE: openquake/engine

jobs:
  docker:
    name: Build, test, push
    runs-on: ubuntu-latest
    env:
      DOCKER_USERNAME: ${{ secrets.docker_username }}
      DOCKER_PASSWORD: ${{ secrets.docker_password }}

    steps:
      # ── 1. Resolve variabili ──────────────────────────────────
      - id: vars
        name: Resolve variables
        run: |
          case "${{ github.event_name }}" in
            workflow_dispatch)
              echo "▶ Manual run"
              REF="${{ github.event.inputs.git-ref }}"
              TAGS="${{ github.event.inputs.tags }}"
              ;;
            push)
              echo "▶ Push to ${{ github.ref_name }}"
              REF="${{ github.ref_name }}"
              TAGS="devel"
              ;;
            *)
              echo "▶ Scheduled run"
              REF="master"
              TAGS="nightly"
              ;;
          esac

          PRIMARY=$(echo "$TAGS" | cut -f1 -d, | tr -d '[:space:]')
          TAG_ARGS=""
          for tag in $(echo "$TAGS" | tr ',' '\n'); do
            TAG_ARGS="$TAG_ARGS -t $IMAGE:$tag"
          done
          {
            echo "REPO_REF=$REF"
            echo "TAGS=$TAGS"
            echo "PRIMARY=$PRIMARY"
            echo "TAG_ARGS=$TAG_ARGS"
          } >> "$GITHUB_OUTPUT"

          echo "---"
          echo "REPO_REF = $REF"
          echo "TAGS     = $TAGS"
            echo "PRIMARY  = $PRIMARY"
          echo "TAG_ARGS = $TAG_ARGS"

      # ── 2. Checkout ───────────────────────────────────────────
      - name: Clone repository
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.vars.outputs.REPO_REF }}

      # ── 3. Build ──────────────────────────────────────────────
      - name: Docker build ${{ steps.vars.outputs.TAGS }}
        run: |
          docker build \
            --build-arg oq_branch=${{ steps.vars.outputs.REPO_REF }} \
            ${{ steps.vars.outputs.TAG_ARGS }} \
            -f docker/Dockerfile.engine \
            docker

      - name: List images
        run: docker image ls "$IMAGE"

      # ── 4. Test ───────────────────────────────────────────────
      - name: Run tests
        run: |
          set -e
          IMG="$IMAGE:${{ steps.vars.outputs.PRIMARY }}"

          # 4a – Single-shot calc
          echo "▶ Single-shot calc"
          time docker run "$IMG" \
            oq engine --run \
            /opt/openquake/demos/risk/ScenarioDamage/job_hazard.ini \
            /opt/openquake/demos/risk/ScenarioDamage/job_risk.ini

          # 4b – WebUI container
          echo "▶ Starting WebUI"
          cat > ./.env << EOF
          OQ_APPLICATION_MODE=RESTRICTED
          OQ_ADMIN_USERNAME=user
          OQ_ADMIN_PASSWORD=login
          OQ_ADMIN_EMAIL=user@login.input
          EMAIL_BACKEND='django.core.mail.backends.smtp.EmailBackend'
          EMAIL_HOST=smtp.gmail.com
          EMAIL_PORT=587
          EMAIL_USE_TLS=True
          EMAIL_HOST_USER=admin@reply.com
          EMAIL_HOST_PASSWORD=polhjuih@
          EMAIL_SUPPORT=noreply@reply.com
          DJANGO_SETTINGS_MODULE=openquake.server.settings
          EOF

          docker run --name openquake -d --env-file=./.env \
            -p 127.0.0.1:8800:8800 "$IMG"

          # 4c – Wait for WebUI
          echo "▶ Waiting for WebUI on :8800"
          sleep 30
          while [[ "$(curl -s -o /dev/null -w '%{http_code}' \
            http://127.0.0.1:8800/accounts/login/)" != "200" ]]; do
            echo "  … waiting"
            sleep 5
          done
          echo "  WebUI up!"

          # 4d – Django login
          echo "▶ Django login"
          LOGIN_URL="http://127.0.0.1:8800/accounts/login/"
          COOKIES=cookies.txt
          curl -s -c "$COOKIES" -b "$COOKIES" -e "$LOGIN_URL" "$LOGIN_URL" > /dev/null
          CSRF="csrfmiddlewaretoken=$(grep csrftoken "$COOKIES" | sed 's/^.*csrftoken\s*//')"
          curl -s -c "$COOKIES" -b "$COOKIES" -e "$LOGIN_URL" \
            -d "${CSRF}&username=user&password=login" \
            -X POST "$LOGIN_URL" > /dev/null
          docker logs -t -n 5 openquake

          # 4e – Calcs via exec
          echo "▶ Exec – hazard"
          sleep 3
          time docker exec -t openquake \
            oq engine --run \
            /opt/openquake/demos/hazard/AreaSourceClassicalPSHA/job.ini

          echo "▶ Exec – risk"
          time docker exec -t openquake \
            oq engine --run \
            /opt/openquake/demos/risk/ScenarioDamage/job_hazard.ini \
            /opt/openquake/demos/risk/ScenarioDamage/job_risk.ini

          # 4f – Fresh container
          echo "▶ Fresh container"
          sleep 2
          time docker run "$IMG" \
            oq engine --run \
            /opt/openquake/demos/risk/ScenarioDamage/job_hazard.ini \
            /opt/openquake/demos/risk/ScenarioDamage/job_risk.ini

          # Cleanup
          docker stop openquake 2>/dev/null || true
          docker rm   openquake 2>/dev/null || true

      # ── 5. Push ───────────────────────────────────────────────
      - name: Login to Docker Hub
        run: docker login -u="$DOCKER_USERNAME" -p="$DOCKER_PASSWORD"

      - name: Push ${{ steps.vars.outputs.TAGS }}
        run: |
          for tag in $(echo "${{ steps.vars.outputs.TAGS }}" | tr ',' '\n'); do
            echo "→ push $IMAGE:$tag"
            docker push "$IMAGE:$tag"
          done
