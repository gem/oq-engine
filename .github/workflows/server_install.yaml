---
name: Installation of OQ (server and devel)
# One workflow for the two installations of the engine:
#  - server: install.py server, as in production (WebUI from systemd,
#    gunicorn, checks as root, journal checked);
#  - devel: install.py devel_server, from a clone of the repository, as the
#    openquake user (WebUI from systemd as well, with the gunicorn switch).
# The kinds run by each trigger are chosen by the plan job below.
on:
  workflow_dispatch:
    inputs:
      git-ref:
        description: Git Ref Branch
        default: master
        required: true
      debug_enabled:
        type: boolean
        description: "Run the build with upterm debugging enabled"
        required: false
        default: false
  # 11:05 runs server, 15:05 runs devel
  schedule:
    - cron: "05 11 * * *"
    - cron: "05 15 * * *"
  # Called from engine_pr_test.yml on every PR (not for forks)
  workflow_call:
    inputs:
      git-ref:
        description: Git Ref Branch
        type: string
        default: master
        required: false

jobs:
  plan:
    # Decides the kinds to run: the matrix of the install job
    runs-on: ubuntu-24.04
    outputs:
      kinds: ${{ steps.plan.outputs.kinds }}
    steps:
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          case "$EVENT" in
            schedule)
              if [ "$SCHEDULE" = "05 11 * * *" ]; then
                kinds='["server"]'
              else
                kinds='["devel_server"]'
              fi ;;
            *) kinds='["server","devel_server"]' ;;  # PR, manual run
          esac
          echo "kinds=$kinds" >> "$GITHUB_OUTPUT"
          echo "kinds=$kinds"

  install:
    needs: plan
    name: ${{ matrix.kind }} Python 3.11
    runs-on: ubuntu-24.04
    env:
      MPLCONFIGDIR: /tmp  # matplotlib cache outside the home
    strategy:
      fail-fast: false
      matrix:
        kind: ${{ fromJSON(needs.plan.outputs.kinds) }}
    steps:
      - name: Set up Python  3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Checkout the code to test
        # the scripts of this repository (webui_checks.sh) and the test
        # archives are taken from here; the code installed is below
        uses: actions/checkout@v6
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || inputs.git-ref || github.ref }}
      - name: Setup upterm session
        uses: owenthereal/action-upterm@v2
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.debug_enabled }}
        with:
          ## Shut down the server if unconnected after 60 minutes.
          wait-timeout-minutes: 60
      # ---- server ----
      - name: Install OQ (server)
        if: matrix.kind == 'server'
        env:
          GIT_REF: ${{ inputs.git-ref }}
        run: |
          BRANCH="${GIT_REF:-master}"
          sudo -H "$(which python3)" install.py --version "$BRANCH" server
      - name: Actualize 'default' templates for email notifications (server)
        if: matrix.kind == 'server'
        run: |
          SITE_PKG="/opt/openquake/venv/lib/python3.11/site-packages/"
          cd ${SITE_PKG}
          for file in openquake/server/templates/registration/*.default.tmpl; do
             echo ' cp -- "$file" "${file%.default.tmpl}" '
             cp -- "$file" "${file%.default.tmpl}"
          done
          ls -lrt ${SITE_PKG}/openquake/server/templates/registration/
      # Local emulation without root: .github/scripts/emulate_server_install.sh
      # (see its header). What the emulation does NOT check, i.e. what only
      # the server step below and the install step above test:
      #  - install.py and its systemd units (/etc/systemd/system/
      #    openquake-webui.service and openquake-dbserver.service),
      #    including the sed that adapts the gunicorn ExecStart to the CI
      #    and the daemon-reload
      #  - the openquake user, file ownership, /var/log/oq-engine, and the
      #    secret in /etc/openquake/django_secret.env
      #  - the WebUI imported from /opt/openquake site-packages, not from
      #    the repository, with its real local_settings.py (SMTP settings)
      #  - the environment of systemd (GITHUB_ACTIONS unset, no USER
      #    override: the access log is written because the service runs as
      #    openquake)
      #  - the email backend: SMTP here, in-memory in the emulation
      # The emulation does not run the concurrency check either
      # (.github/scripts/run_webui_concurrency.sh): it is not in this job.
      #
      # Requests that keep a gunicorn worker busy (read from the code, not
      # all measured; the gunicorn command of the server step uses
      # --workers 2):
      #  - downloading a result that is generated on request, e.g.
      #    /v1/calc/result/<id> for a large GMF: the export runs inside the
      #    request, before the first byte is sent
      #  - the IMPACT calls to USGS (impact_get_stations_from_usgs,
      #    impact_get_shakemap_versions, impact_get_nodal_planes_and_info):
      #    synchronous, 30 s timeout per attempt, up to 5 attempts
      #  - downloading /v1/calc/<id>/datastore (calc_<id>.hdf5): streamed,
      #    but the worker stays busy until the client has received it
      #  - /extract: loads the data into memory before saving it
      #  Effects to check: with N workers, N such requests make the WebUI
      #  unresponsive for everybody else; a worker that does not answer
      #  within --timeout is killed (log: WORKER TIMEOUT) and the client gets
      #  a dropped connection. A calc run with oq engine --run by a user
      #  other than openquake posts each log line to /v0/db/log of the
      #  DbServer (port 1908), a separate service, so it does not compete
      #  with the WebUI for the gunicorn workers.
      - name: WebUI and calculation with Auth (server)
        if: matrix.kind == 'server'
        shell: sudo su root -c "bash --noprofile --norc -e -o pipefail {0}"
        run: |
          whoami  # Outputs: root
          source /opt/openquake/venv/bin/activate
          set -a
          source /etc/openquake/django_secret.env
          set +a
          mkdir -p /var/log/oq-engine/
          chown -R openquake /var/log/oq-engine/
          runuser -l openquake -c '/opt/openquake/venv/bin/oq engine --upgrade-db'
          oq --version
          #
          SITE_PKG="/opt/openquake/venv/lib/python3.11/site-packages/"
          # the settings of the WebUI and the users of the tests, from the
          # scripts of this repository (see the scripts for the details)
          SCRIPTS="${{ github.workspace }}/.github/scripts"
          "$SCRIPTS/webui_local_settings.sh" "${SITE_PKG}openquake/server"
          cat "${SITE_PKG}openquake/server/local_settings.py"
          cd "${SITE_PKG}openquake/server"
          # Perform migration after setup local_settings
          /opt/openquake/venv/bin/python3 manage.py migrate
          "$SCRIPTS/create_webui_users.sh" /opt/openquake/venv/bin/python3 \
            "${SITE_PKG}openquake/server" openquake user2 user3 user4
          # gunicorn instead of runserver, as in the documentation
          "$SCRIPTS/webui_unit.sh" "${SITE_PKG}openquake/server"
          # STOP AND START WEBUI; restart the DbServer too, so that it reads
          # the local settings written above
          systemctl stop openquake-webui
          sleep 10
          systemctl restart openquake-dbserver
          systemctl start openquake-webui
      - name: Server checks (WebUI as openquake and user2, user3 and user4)
        # as root, for the journal; the checks are in server_checks.sh
        if: matrix.kind == 'server'
        shell: sudo su root -c "bash --noprofile --norc -e -o pipefail {0}"
        run: |
          ${{ github.workspace }}/.github/scripts/server_checks.sh \
            --repo ${{ github.workspace }} --base http://127.0.0.1:8800 \
            --access-log-dir /var/log/oq-engine --journal
      - name: DbServer checks (server)
        # as root, to create the regular user running oq engine --run
        if: matrix.kind == 'server'
        shell: sudo su root -c "bash --noprofile --norc -e -o pipefail {0}"
        run: |
          ${{ github.workspace }}/.github/scripts/dbserver_checks.sh \
            ${{ github.workspace }}/openquake/qa_tests_data/classical/case_01
      # ---- devel ----
      - name: Create openquake user (devel_server)
        if: matrix.kind == 'devel_server'
        run: |
          sudo useradd -d /home/openquake -m  -s /bin/bash openquake
          sudo usermod -aG sudo openquake
          echo "openquake ALL=(ALL) NOPASSWD:ALL" | sudo tee /etc/sudoers.d/openquake
      - name: Install OQ (devel_server)
        if: matrix.kind == 'devel_server'
        env:
          # the code to install: the head of the pull request (also when it
          # comes from a fork), the git-ref of a manual run, or master
          SRC_URL: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.clone_url || 'https://github.com/gem/oq-engine.git' }}
          SRC_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || inputs.git-ref || 'master' }}
        run: |
          echo "Installing ref=${SRC_REF} from ${SRC_URL}"
          cat > /tmp/scripts.sh <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          echo "Running as $(whoami) in $(pwd), ref=${SRC_REF}"
          cd /home/openquake
          rm -rf oq-engine
          git clone "$SRC_URL" oq-engine
          cd oq-engine
          git checkout "$SRC_REF"
          sudo -H $PY_TO_USE install.py devel_server
          EOF
          chmod +x /tmp/scripts.sh
          sudo -i -u openquake HOME=/home/openquake SRC_URL="$SRC_URL" SRC_REF="$SRC_REF" PY_TO_USE=$(which python3) bash /tmp/scripts.sh
      - name: Actualize 'default' templates for email notifications (devel_server)
        if: matrix.kind == 'devel_server'
        run: |
          sudo runuser -l openquake  -c ' cd oq-engine ; for file in openquake/server/templates/registration/*.default.tmpl; do
          cp -- "$file" "${file%.default.tmpl}"
          done
          '
      - name: WebUI and calculation with Auth (devel_server)
        if: matrix.kind == 'devel_server'
        run: |
           set -o pipefail
           sudo systemctl stop openquake-webui
           source /opt/openquake/venv/bin/activate
           sudo mkdir -p /var/log/oq-engine/
           sudo chown -R openquake /var/log/oq-engine/
           sudo runuser -l openquake -c '
           /opt/openquake/venv/bin/oq engine --upgrade-db
           oq --version
           #
           echo "Add settings for login and logging on webui before to start"
           /home/openquake/oq-engine/.github/scripts/webui_local_settings.sh /home/openquake/oq-engine/openquake/server
           cat /home/openquake/oq-engine/openquake/server/local_settings.py
           '
           # Perform migration after setup local_settings
           # the secret file is readable only by the openquake user and
           # runuser -l resets the environment
           sudo runuser -l openquake -c '
           set -a
           source /etc/openquake/django_secret.env
           set +a
           source /opt/openquake/venv/bin/activate
           cd /home/openquake/oq-engine/openquake/server
           python3 manage.py migrate
           /home/openquake/oq-engine/.github/scripts/create_webui_users.sh python3 /home/openquake/oq-engine/openquake/server level_1_user
           '
           # gunicorn instead of runserver, as in the documentation
           sudo /home/openquake/oq-engine/.github/scripts/webui_unit.sh /home/openquake/oq-engine/openquake/server
           # START WEBUI; restart the DbServer too, so that it reads the
           # local settings written above
           sudo systemctl restart openquake-dbserver
           sudo systemctl start openquake-webui
           # zip area source demo into job.zip
           zip job.zip ${{ github.workspace }}/demos/hazard/AreaSourceClassicalPSHA/*
      - name: WebUI checks (devel_server)
        if: matrix.kind == 'devel_server'
        run: |
          ${{ github.workspace }}/.github/scripts/webui_checks.sh \
            --base http://127.0.0.1:8800 --user level_1_user \
            --password level_1_password --archive "${{ github.workspace }}/job.zip" \
            --access-log-dir /var/log/oq-engine
      - name: DbServer checks (devel_server)
        if: matrix.kind == 'devel_server'
        run: |
          sudo ${{ github.workspace }}/.github/scripts/dbserver_checks.sh \
            ${{ github.workspace }}/openquake/qa_tests_data/classical/case_01
