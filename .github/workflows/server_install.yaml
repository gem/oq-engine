---
name: Server Installation of OQ
on:
  workflow_dispatch:
    inputs:
      git-ref:
        description: Git Ref Branch
        default: master
        required: true
      debug_enabled:
        type: boolean
        description: "Run the build with upterm debugging enabled"
        required: false
        default: false
  schedule:
    - cron: "05 11 * * *"
  # Called from engine_pr_test.yml (only when install.py changed)
  workflow_call:
    inputs:
      git-ref:
        description: Git Ref Branch
        type: string
        default: master
        required: false

jobs:
  Sever_Installation:
    name: Server OQ  Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    env:
      GITHUB_DEF_BR: ${{ github.event.repository.default_branch }}
      GITHUB_REF: ${{ github.ref }}
      GITHUB_HD_REF: ${{ github.head_ref }}}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Clone Repository (Master)
        uses: actions/checkout@v6
        if: inputs.git-ref == ''
      - name: Clone Repository (Custom Ref)
        uses: actions/checkout@v6
        if: inputs.git-ref != ''
        with:
          ref: ${{ inputs.git-ref }}
      - name: Set up Python  ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Setup upterm session
        uses: owenthereal/action-upterm@v2
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.debug_enabled }}
        with:
          ## Shut down the server if unconnected after 45 minutes.
          wait-timeout-minutes: 60
      - name: Install OQ Server with ${{ matrix.python-version }}
        run: |
          if [ -z ${{ inputs.git-ref }} ];
          then
             BRANCH=master
          else
             BRANCH=${{ inputs.git-ref }}
          fi
          sudo -H "$(which python3)" install.py --version "$BRANCH" server
          if [[ $EXIT_CODE -ne 0 ]]; then
                break
          fi
      - name: Actualize 'default' templates for email notifications
        run: |
          SITE_PKG="/opt/openquake/venv/lib/python${{ matrix.python-version }}/site-packages/"
          cd ${SITE_PKG}
          for file in openquake/server/templates/registration/*.default.tmpl; do
             echo ' cp -- "$file" "${file%.default.tmpl}" '
             cp -- "$file" "${file%.default.tmpl}"
          done
          ls -lrt ${SITE_PKG}/openquake/server/templates/registration/
      # Local emulation without root: .github/scripts/emulate_server_install.sh
      # (see its header). What the emulation does NOT check, i.e. what only
      # this step and the install step above test:
      #  - install.py and its systemd unit (/etc/systemd/system/
      #    openquake-webui.service), including the sed that sets gunicorn
      #    as ExecStart and the daemon-reload
      #  - the openquake user, file ownership, /var/log/oq-engine, and the
      #    secret in /etc/openquake/django_secret.env
      #  - the WebUI imported from /opt/openquake site-packages, not from
      #    the repository, with its real local_settings.py (SMTP settings)
      #  - the environment of systemd (GITHUB_ACTIONS unset, no USER
      #    override: the access log is written because the service runs as
      #    openquake)
      #  - the email backend: SMTP here, in-memory in the emulation
      # The emulation does not run the concurrency check either
      # (.github/scripts/run_webui_concurrency.sh): it is not in this job.
      #
      # Requests that keep a gunicorn worker busy (read from the code, not
      # all measured; the gunicorn command of this step uses --workers 2):
      #  - downloading a result that is generated on request, e.g.
      #    /v1/calc/result/<id> for a large GMF: the export runs inside the
      #    request, before the first byte is sent
      #  - the IMPACT calls to USGS (impact_get_stations_from_usgs,
      #    impact_get_shakemap_versions, impact_get_nodal_planes_and_info):
      #    synchronous, 30 s timeout per attempt, up to 5 attempts
      #  - downloading /v1/calc/<id>/datastore (calc_<id>.hdf5): streamed,
      #    but the worker stays busy until the client has received it
      #  - /extract: loads the data into memory before saving it
      #  Effects to check: with N workers, N such requests make the WebUI
      #  unresponsive for everybody else; a worker that does not answer
      #  within --timeout is killed (log: WORKER TIMEOUT) and the client gets
      #  a dropped connection; a calc run with oq engine --run by a user
      #  other than openquake posts each log line to /v0/db/log and waits
      #  for a free worker, so it can look stalled.
      - name: WebUI and calculation with Auth
        shell: sudo su root -c "bash --noprofile --norc -e -o pipefail {0}"
        run: |
          whoami  # Outputs: root
          source /opt/openquake/venv/bin/activate
          set -a
          source /etc/openquake/django_secret.env
          set +a
          mkdir -p /var/log/oq-engine/
          chown -R openquake /var/log/oq-engine/
          runuser -l openquake -c '/opt/openquake/venv/bin/oq engine --upgrade-db'
          oq --version
          #
          echo "Add settings for login and logging on webui before to start"
          SITE_PKG="/opt/openquake/venv/lib/python${{ matrix.python-version }}/site-packages/"
          cd  ${SITE_PKG}
          cd openquake/server
          cat > local_settings.py << EOF
          APPLICATION_MODE = "RESTRICTED"
          EMAIL_BACKEND = 'django.core.mail.backends.smtp.EmailBackend'
          EMAIL_HOST = 'smtp.gmail.com'
          EMAIL_PORT = 587
          EMAIL_USE_TLS = True
          EMAIL_HOST_USER = 'admin@reply.com'
          EMAIL_HOST_PASSWORD = 'polhjuih@'
          EMAIL_SUPPORT = 'noreply@reply.com'
          WEBUI_ACCESS_LOG_DIR = '/var/log/oq-engine'
          EOF
          echo "DISPLAY content of local_settings"
          cat local_settings.py
          # Perform migration after setup local_settings
          /opt/openquake/venv/bin/python3 manage.py migrate
          /opt/openquake/venv/bin/python3 manage.py createuser openquake testuser1@test.com --level 1 --password level_1_password --no-email
          # Install gunicorn in the venv (optional dependency of
          # openquake.engine[server], pinned as in pyproject.toml).
          # Do not install the extra itself: it would replace the
          # engine under test with the one from PyPI
          /opt/openquake/venv/bin/pip install "gunicorn>=26.2"
          # Replace the ExecStart of the WebUI unit written by install.py
          # with gunicorn, as in doc/getting-started/installation-instructions/server.md
          sed -i \
            -e "s|^WorkingDirectory=.*|WorkingDirectory=${SITE_PKG}openquake/server|" \
            -e "s|^ExecStart=.*|ExecStart=/opt/openquake/venv/bin/gunicorn --bind 127.0.0.1:8800 --workers 2 --timeout 120 wsgi:application|" \
            /etc/systemd/system/openquake-webui.service
          systemctl daemon-reload
          # STOP AND START WEBUI
          systemctl stop openquake-webui
          sleep 10
          systemctl start openquake-webui
          echo "Waiting WEBUI up on port 8800...."
          echo "Test WebUI with curl before to test django"
          while [[ "$(curl -s -o /dev/null -w ''%{http_code}'' http://127.0.0.1:8800/accounts/login/)" != "200" ]]; do
            echo "Still waiting WEBUI account login up on port 8800...."
            sleep 5 # wait for 5 seconds before check again
          done
          echo -n "TEST DJANGO LOGIN "
          LOGIN_URL=http://127.0.0.1:8800/accounts/login/
          YOUR_USER='openquake'
          YOUR_PASS='level_1_password'
          COOKIES=cookies.txt
          CURL_BIN="curl -s -c $COOKIES -b $COOKIES -e $LOGIN_URL"
          echo -n "Django Auth: get csrftoken ..."
          $CURL_BIN $LOGIN_URL -o /dev/null
          DJANGO_TOKEN="csrfmiddlewaretoken=$(grep csrftoken $COOKIES | sed 's/^.*csrftoken\s*//')"
          echo " perform login ..."
          status_code=$($CURL_BIN -w "%{http_code}"\
             -d "$DJANGO_TOKEN&username=$YOUR_USER&password=$YOUR_PASS" \
             -X POST $LOGIN_URL -o /dev/null)
          if [ $status_code != "302" ]; then
           echo "Unable to login"
           exit 1
          fi
          echo "--------------------"
          echo "display log of webui"
          echo "--------------------"
          cat /var/log/oq-engine/webui-access.log
          if [ -s /var/log/oq-engine/webui-access.log ]; then
           # The file is not-empty.
           cat /var/log/oq-engine/webui-access.log
          else
           echo "/var/log/oq-engine/webui-access.log is empty. Something did not work as expected"
           exit 1
          fi
          echo " Run a calc using https"
          runuser -l openquake -c '/opt/openquake/venv/bin/oq engine --run https://raw.githubusercontent.com/gem/oq-engine/master/openquake/server/tests/data/archive_ok.zip'
          sleep 10
          status_code=$($CURL_BIN -w "%{http_code}"\
             -d "$DJANGO_TOKEN&username=$YOUR_USER&password=$YOUR_PASS" \
             -G http://127.0.0.1:8800/engine/1/outputs -o /dev/null)
          if [ $status_code != "200" ]; then
           echo "Unable to visualize outputs"
           exit 1
          fi
