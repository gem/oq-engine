[build-system]
requires = ["setuptools >= 84.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openquake.engine"
readme = "README.md"
dynamic = ["version"]
description = "OpenQuake Engine: A software for Seismic Hazard and Risk Analysis"
requires-python = ">3.12, <3.15"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
    { name = "GEM Foundation", email = "info@openquake.org" }
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]

# Core dependencies (simplified based on common engine requirements)
# Note: oq-engine uses requirements-py3x.txt files for exact pinning
dependencies = [
    "numpy~=2.4.6",
    "scipy~=1.17.1",
    "pandas~=2.3.3",
    "h5py~=3.15.1",
    "django~=5.2.19",
    "psutil~=7.2.2",
    "requests~=2.33.0",
    "pyzmq~=27.3.0",
    "h3~=4.4.1",

    # unplanned deps
    "decorator~=5.1.1",
    "pillow~=13.0.0",
    "toml~=0.10.2",
    "numba~=0.68.0",
    "alpha_shapes~=1.1.0",
    "django_cors_headers~=4.9.0",
    "django_cookie_consent~=1.0.0",
    "urllib3~=2.8.0",
    "sqlparse~=0.6.1",

    # geopackages
    "gdal~=3.13.3",
    "pyproj~=3.8.0",
    "geopandas~=1.2.0",
    "fiona~=1.10.1",
]

[project.optional-dependencies]
# needed only by Server Installation method (see doc/getting-started/installation-instructions/server.md)
server = [
    "gunicorn~=26.2.0",
]
test = [
    "pytest~=9.0.3",
    "pytest_django~=4.9.0",
]
impact = [
    "affine~=2.4.0",
    "timezonefinder~=8.2.1",
    "adjustText~=1.3.0",
    "mapclassify~=2.10.0",
    "reportlab~=4.4.9",
    "pymupdf~=1.27.2.3",
    "matplotlib_scalebar~=0.9.0",
    "python_dateutil~=2.8.2",
    "rasterio~=1.5.2",
]
aelo = [
    "rtgmpy~=1.0.1",
]

doc = [
    "sphinx~=9.2.0",
    "pydata-sphinx-theme~=0.24.0",
    "myst-parser~=5.2.0",
    "pygments-csv-lexer~=0.1.3",
    "sphinx-copybutton~=0.5.2",
    "sphinx-design~=0.8.0",
    "sphinxcontrib-images~=1.0.1",
    "sphinxcontrib-youtube~=1.5.0",
    "sphinx-rtd-theme~=3.1.0",
]

[project.urls]
Homepage = "https://globalquakemodel.org"
Repository = "https://github.com/gem/oq-engine"
Documentation = "https://docs.openquake.org"

[project.scripts]
oq = "openquake.commands.__main__:oq"

[tool.setuptools]
include-package-data = true

[tool.setuptools.dynamic]
version = {attr = "openquake.baselib.__version__"}

[tool.setuptools.package-data]
"openquake" = ["openquake.cfg", "README.md", "LICENSE", "CONTRIBUTORS.txt"]

[tool.setuptools.packages.find]
namespaces = true
where = ["."]
include = ["openquake.*"]
exclude = [
    "qa_tests", "qa_tests.*",
    "tools",
    "*.*.tests", "*.*.tests.*",
    "openquake.engine.bin",
    "openquake.engine.bin.*"
]

[tool.ruff]
line-length = 79
lint.select = ["E", "F"]
lint.extend-ignore = ["E501"]  # ignore long lines in docstrings
